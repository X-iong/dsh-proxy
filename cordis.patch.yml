# dsh-proxy bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package: when
# the plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-proxy@<version>
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-proxy` to the bundle stack. The
# profile boot then merges THIS patch (a single `insert` of the plugin row).
# No profile file edits needed — one command installs and mounts.
#
# The row id is load-bearing, not cosmetic: in this harness a plugin's editable
# configuration IS its own Loader entry, so `dsh-proxy` is simultaneously
#   * the settings namespace the framework derives a form from,
#   * the id the browser half addresses with `configForms.get(...)`, and
#   * half of the `plugins.row.config` key (`dsh-proxy#dsh-proxy`) the card
#     registers under.
# Mounting the plugin under another id still installs the proxy, but the
# configuration card will not appear; the host half logs that case.
#
# To set the proxy on first boot, add the values to the inserted row — they are
# all live-editable afterwards from the Plugins page:
#
#   - insert:
#       - id: dsh-proxy
#         name: 'dsh-proxy'
#         config:
#           enabled: true
#           host: 127.0.0.1
#           port: 7890
#           noProxy: [localhost, 127.0.0.1, '::1', '[::1]']
#           autoReset: true
#           probeUrl: https://api.deepseek.com/models
#
# Double-mount guard: if another enabled entry already mounts `dsh-proxy` under a
# different id (e.g. an aggregate bundle), this row backs off so the global
# dispatcher is only ever installed once.
- insert:
    - id: dsh-proxy
      name: 'dsh-proxy'
      disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.name === 'dsh-proxy' && e.options.id !== 'dsh-proxy' && !e.disabled)"
